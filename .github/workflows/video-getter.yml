name: Download Video with Quality Selection

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو'
        required: true
        type: string
      quality:
        description: 'کیفیت مورد نظر'
        required: true
        default: 'best'
        type: choice
        options:
          - 'best'
          - '1080'
          - '720'
          - '480'
          - '360'
          - '240'
          - '144'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v1

      - name: Create download folder
        run: mkdir -p downloaded-videos

      - name: Download video with selected quality
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          
          if [ "$QUALITY" = "best" ]; then
            yt-dlp -f "best" -o "downloaded-videos/%(title)s.%(ext)s" "${{ github.event.inputs.video_url }}"
          else
            yt-dlp -f "bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]" \
                   -o "downloaded-videos/%(title)s.%(ext)s" \
                   "${{ github.event.inputs.video_url }}"
          fi

      - name: List downloaded files
        run: ls -la downloaded-videos/

      - name: Upload entire folder
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-videos
          path: downloaded-videos/
